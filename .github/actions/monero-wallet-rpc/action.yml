name: monero-wallet-rpc
description: Spawns a Monero Wallet-RPC

inputs:
  version:
    description: "Version to download and run"
    required: false
    default: v0.18.4.6

runs:
  using: "composite"
  steps:
    - name: Monero Wallet RPC Cache
      id: cache-monero-wallet-rpc
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
      with:
        path: monero-wallet-rpc
        key: monero-wallet-rpc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Download the Monero Wallet RPC
      if: steps.cache-monero-wallet-rpc.outputs.cache-hit != 'true'
      # Calculates OS/ARCH to demonstrate it, yet then locks to linux-x64 due
      # to the contained folder not following the same naming scheme and
      # requiring further expansion not worth doing right now
      shell: bash
      run: |
        RUNNER_OS=${{ runner.os }}
        RUNNER_ARCH=${{ runner.arch }}

        RUNNER_OS=${RUNNER_OS,,}
        RUNNER_ARCH=${RUNNER_ARCH,,}

        RUNNER_OS=linux
        RUNNER_ARCH=x64

        FILE=monero-$RUNNER_OS-$RUNNER_ARCH-${{ inputs.version }}.tar.bz2
        wget https://downloads.getmonero.org/cli/$FILE

        # Verify the download against the SHA256 hash published for the release, refusing to
        # install any version without a hash on record
        case ${{ inputs.version }} in
          v0.17.3.2)
            HASH=1e54acd749265d9439d3733441c645d9b058316283c8f21cca2a333c1238cd16;;
          v0.18.4.6)
            HASH=60cfc32d39c6fe6c19b23513d02017fe9055d2e412ee4cbc30fa40ba811fe052;;
          *)
            echo "No SHA256 hash on record for Monero ${{ inputs.version }}" >&2
            exit 1;;
        esac
        echo "$HASH  $FILE" | sha256sum -c -

        tar -xvf $FILE

        mv monero-x86_64-linux-gnu-${{ inputs.version }}/monero-wallet-rpc monero-wallet-rpc

    - name: Monero Wallet RPC
      shell: bash
      run: |
        ./monero-wallet-rpc --allow-mismatched-daemon-version \
          --daemon-address 0.0.0.0:18081 --daemon-login monero:oxide \
          --disable-rpc-login --rpc-bind-port 18082 \
          --wallet-dir ./ \
          --detach
